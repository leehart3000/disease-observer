name: "ETL: UKHSA"

on:
  schedule:
    # Fridays at 07:37 UTC. Scheduled runs always use etl-prod.
    - cron: "37 7 * * 5"
  workflow_dispatch:
    inputs:
      target:
        description: "Database environment to load into"
        type: choice
        required: true
        default: db-dev
        options:
          - db-dev
          - etl-prod
      from:
        description: "Backfill COVID-19 from this year (four digits). Leave empty for the current year."
        type: string
        required: false
      limit:
        description: "Only load the first N local authorities (for test runs). Leave empty for all."
        type: string
        required: false
      only:
        description: "Only load these kinds of area: a comma-separated list of nation, region and lad (no spaces). Leave empty for all."
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: etl-ukhsa-${{ github.event_name == 'schedule' && 'etl-prod' || inputs.target }}
  cancel-in-progress: false

jobs:
  etl:
    name: load UKHSA data (${{ github.event_name == 'schedule' && 'etl-prod' || inputs.target }})
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: ${{ github.event_name == 'schedule' && 'etl-prod' || inputs.target }}
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Load UKHSA data
        run: |
          args=()
          if [ -n "$FROM" ]; then
            if ! [[ "$FROM" =~ ^[0-9]{4}$ ]]; then
              echo "::error::The 'from' input must be a four-digit year, such as 2023."
              exit 1
            fi
            args+=("--from=$FROM")
          fi
          if [ -n "$LIMIT" ]; then
            if ! [[ "$LIMIT" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::The 'limit' input must be a positive whole number, such as 5."
              exit 1
            fi
            args+=("--limit=$LIMIT")
          fi
          if [ -n "$ONLY" ]; then
            if ! [[ "$ONLY" =~ ^(nation|region|lad)(,(nation|region|lad))*$ ]]; then
              echo "::error::The 'only' input must be a comma-separated list of nation, region and lad, such as nation,region."
              exit 1
            fi
            args+=("--only=$ONLY")
          fi
          pnpm etl:ukhsa "${args[@]}"
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
          FROM: ${{ inputs.from }}
          LIMIT: ${{ inputs.limit }}
          ONLY: ${{ inputs.only }}
